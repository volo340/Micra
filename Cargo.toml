[workspace]
resolver = "2"
members = ["crates/micra-core", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license-file = "LICENSE"
publish = false
repository = "https://github.com/volo340/Micra"

[workspace.dependencies]
micra-core = { path = "crates/micra-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
