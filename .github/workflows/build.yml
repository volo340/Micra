# Compila Micra en la nube: nadie necesita instalar Node ni Rust en su PC.
#
# - En cada pull request: tests del núcleo y los instaladores como artefactos
#   descargables (pestaña Actions > ejecución > Artifacts).
# - Al subir una etiqueta vX.Y.Z: además crea un borrador de release en GitHub
#   con el .exe de Windows, el AppImage/.deb/.rpm de Linux y micra-install.sh.
name: Build

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # 22.04 y no la última: el AppImage hereda su glibc y así funciona
          # también en distribuciones más antiguas.
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de compilación (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests del núcleo
        run: cargo test -p micra-core

      - name: Dependencias del frontend
        run: npm ci

      - name: Compilar instaladores
        run: npm run tauri build
        env:
          # Opcional: si existe el secreto, la búsqueda de CurseForge queda activada.
          MICRA_CURSEFORGE_API_KEY: ${{ secrets.MICRA_CURSEFORGE_API_KEY }}

      - name: Reunir instaladores
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe
                 target/release/bundle/appimage/*.AppImage
                 target/release/bundle/deb/*.deb
                 target/release/bundle/rpm/*.rpm)
          [ ${#files[@]} -gt 0 ] || { echo "No se generó ningún instalador"; exit 1; }
          cp "${files[@]}" out/
          if [ "$RUNNER_OS" = Linux ]; then
            cp scripts/install.sh out/micra-install.sh
          fi
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: Micra-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Fijar la versión en el instalador de Linux
        run: |
          sed "s/^DEFAULT_VERSION=.*/DEFAULT_VERSION=\"${GITHUB_REF_NAME}\"/" scripts/install.sh > out/micra-install.sh
          ls -la out

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: out/*
