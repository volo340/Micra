[package]
name = "micra-core"
description = "Núcleo de Micra: runtimes de Java, proveedores de modpacks y gestión del proceso del servidor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
directories = "6"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
md-5 = "0.10"
getrandom = "0.3"
keyring = "4"
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
